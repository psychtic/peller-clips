name: Live clip catcher

# Every 15 minutes it checks if Peller is live. If yes, it listens for big moments.
# The repo is public, so Actions minutes are free and unlimited.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-robot
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Step 1 is tiny and quick: is he live? If not, everything below is skipped.
      - name: Check if live
        id: check
        run: |
          pip install requests curl_cffi
          python livebot.py --check-live

      - name: Install ffmpeg and fonts
        if: steps.check.outputs.live == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        if: steps.check.outputs.live == 'true'
        run: pip install -r requirements.txt

      - name: Remember the caption model between runs
        if: steps.check.outputs.live == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Catch live moments
        if: steps.check.outputs.live == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          KICK_CHANNEL: peller
          CREDIT_NAME: Peller
          WINDOW_MINUTES: "30"
          MAX_LIVE_CLIPS: "4"
          SPIKE_DB: "7"
        run: python livebot.py
