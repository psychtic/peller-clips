name: Kick clip robot

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: clip-robot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run the clip robot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KICK_CHANNEL: peller
          CREDIT_NAME: Peller
          MAX_PER_RUN: "2"
          WINDOW_MINUTES: "30"
        run: python clipbot.py

      - name: Remember used clips and the waiting queue
        if: always()
        run: |
          git config user.name "clip-robot"
          git config user.email "clip-robot@users.noreply.github.com"
          git add seen.json queue.json || true
          git diff --cached --quiet || (git commit -m "update used clips" && git pull --rebase && git push)
