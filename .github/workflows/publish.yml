name: Publish approved clips

on:
  schedule:
    - cron: "35,55 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: clip-robot

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publish.txt

      - run: pip install -r requirements-publish.txt

      - name: Publish clips whose reject window is over
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          WINDOW_MINUTES: "30"
          YT_PRIVACY: public
        run: python publisher.py

      - name: Save queue
        if: always()
        run: |
          git config user.name "clip-robot"
          git config user.email "clip-robot@users.noreply.github.com"
          git add queue.json || true
          git diff --cached --quiet || (git commit -m "update queue" && git pull --rebase && git push)
